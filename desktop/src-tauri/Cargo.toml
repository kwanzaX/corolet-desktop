[package]
name = "corolet-desktop"
version = "0.1.0"
description = "Corolet Desktop: workspace memory with streamed, cited answers"
authors = ["João Kwanza"]
license = "MIT"
edition = "2021"

[lib]
name = "corolet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
